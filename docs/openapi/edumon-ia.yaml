openapi: 3.1.0
info:
  title: Edumon IA — endpoints nuevos de la rama edumon.ia
  version: 0.1.0
  description: |
    Contrato para la web. Solo incluye los endpoints NUEVOS de la rama `edumon.ia`
    y los campos nuevos que se agregaron a respuestas existentes (todos opcionales:
    los clientes actuales no se rompen).

    Autenticación: cookie `access_token` (httpOnly, la pone `POST /api/auth/login`)
    o cabecera `Authorization: Bearer <token>`.

    Errores comunes de autorización en todos los endpoints:
    - 401 `{ "message": "Token requerido" }` sin sesión.
    - 403 `{ "message": "No tienes permisos para esta acción" }` con un rol no autorizado.
servers:
  - url: http://localhost:4000
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: Proveedores de IA
    description: Punto 1 — capa de proveedores, salud y límite por usuario.
  - name: Chat de la familia (existente, modulo-ia)
    description: |
      Endpoints que ya existían (merge de modulo-ia) y que usa la demo. Rol: **padre**.
      Las conversaciones son privadas del perfil activo (titular o perfil familiar) y se
      borran a los 30 días sin actividad. Todo excepto `/consentimiento` exige consentimiento
      vigente (403 `CONSENTIMIENTO_REQUERIDO`).
  - name: Evidencia y validación
    description: Retroalimentación de usuarios, métricas de impacto y costo de IA (evidencia para la feria).
  - name: Explicabilidad
    description: |
      Punto 5 — "¿Por qué Edumon dijo esto?". Explica lo que quedó guardado al responder
      (no vuelve a llamar a la IA).
  - name: Ciclo Edumon
    description: |
      Temas anónimos que consultan las familias del curso → sugerencia de módulo y reto → retos creados.
      Privacidad: solo etiquetas de tema (nunca texto); "familia" = titular; un tema aparece solo si lo
      consultaron al menos 5 familias distintas; ventana de 30 días (lo que duran las conversaciones).
      Roles: **docente** dueño del curso o **administrador** de la institución del curso.
  - name: Bitácora de alertas
    description: |
      Punto 4 — bitácora inmutable. Cada evento del historial de una alerta (creación,
      cambio de estado, nota) se encadena con SHA-256 al anterior.
      Roles: **administrador** y **docente** con la misma visibilidad que `GET /api/ia/alertas`
      (admin y responsable de convivencia: todas las de la institución; otro docente: solo
      las de familias de sus cursos). Una alerta que no le corresponde responde 404.

paths:
  /api/ia/health:
    get:
      tags: [Proveedores de IA]
      operationId: getSaludIA
      summary: Estado de cada proveedor de IA
      description: |
        Rol autorizado: **administrador**. Pantalla de la demo: panel de administración
        ("¿con qué IA está respondiendo Edumon?"). Nunca devuelve llaves.
      responses:
        '200':
          description: Estado actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaludIA' }
              example:
                modo: llm
                orden: [groq, openai]
                timeoutMs: 20000
                cooldownSegundos: 60
                proveedores:
                  - nombre: groq
                    modelo: openai/gpt-oss-120b
                    orden: 1
                    estado: en_cooldown
                    cooldownRestanteSegundos: 42
                    motivoCooldown: rate_limit
                    ultimaLatenciaMs: 310
                    ultimoExito: null
                    ultimoError: { tipo: rate_limit, status: 429, en: '2026-10-20T15:02:11.000Z' }
                  - nombre: openai
                    modelo: gpt-4.1-mini
                    orden: 2
                    estado: activo
                    cooldownRestanteSegundos: 0
                    motivoCooldown: null
                    ultimaLatenciaMs: 1840
                    ultimoExito: '2026-10-20T15:02:13.000Z'
                    ultimoError: null
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /api/ia/conversaciones/{id}/mensajes/{mensajeId}/calificacion:
    put:
      tags: [Evidencia y validación]
      operationId: calificarRespuesta
      summary: La familia califica una respuesta de Edumon (útil / no útil)
      description: |
        Rol: **padre** dueño de la conversación, con consentimiento. Una calificación por mensaje y
        perfil: volver a enviarla la reemplaza (200). Solo respuestas de Edumon (`rol: edumon`).
        Pantalla: chat, pulgares 👍/👎 bajo cada respuesta, con comentario opcional.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: mensajeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [util]
              properties:
                util: { type: boolean }
                comentario: { type: string, maxLength: 500 }
                sesionValidacion: { type: string, maxLength: 60, description: 'Etiqueta opcional, p. ej. "feria-2026-10-21", para separar pruebas con usuarios reales' }
      responses:
        '201': { description: 'Primera calificación: `{ message, calificacion: { util, comentario, sesionValidacion, updatedAt } }`' }
        '200': { description: Calificación reemplazada (misma forma) }
        '400': { description: 'IDs inválidos, `util` no booleano, textos demasiado largos o mensaje que no es de Edumon' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: 'Rol distinto de padre o CONSENTIMIENTO_REQUERIDO' }
        '404': { description: Conversación (o mensaje) no encontrada o de otra familia }

  /api/ia/retroalimentacion:
    get:
      tags: [Evidencia y validación]
      operationId: getRetroalimentacion
      summary: Agregado de calificaciones de la institución del administrador
      description: |
        Rol: **administrador**. Sin datos personales: ni familias ni conversaciones; en los comentarios
        se ocultan correos, teléfonos y números largos. Pantalla: panel admin "¿Les sirve Edumon?".
      parameters:
        - { name: sesion, in: query, required: false, schema: { type: string }, description: Filtra por sesión de validación }
        - { name: desde, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Agregado
          content:
            application/json:
              schema:
                type: object
                properties:
                  filtro: { type: object }
                  total: { type: integer }
                  utiles: { type: integer }
                  noUtiles: { type: integer }
                  porcentajeUtil: { type: [number, 'null'] }
                  porTipoRespuesta: { type: object, additionalProperties: { type: object, properties: { total: { type: integer }, utiles: { type: integer }, porcentajeUtil: { type: number } } } }
                  porModoIA: { type: object, additionalProperties: { type: object } }
                  comentariosRecientes:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      properties:
                        util: { type: boolean }
                        comentario: { type: string }
                        tipoRespuesta: { type: [string, 'null'] }
                        modoIA: { type: [string, 'null'] }
                        sesionValidacion: { type: [string, 'null'] }
                        fecha: { type: string, format: date-time }
                  sesionesValidacion: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: Rol distinto de administrador o sin institución }

  /api/ia/metricas:
    get:
      tags: [Proveedores de IA]
      operationId: getMetricasIA
      summary: Métricas reales de seguridad de la IA (solo lectura)
      description: |
        Rol autorizado: **administrador**. Lee los resultados guardados por
        `npm run eval:edumon -- --guardar` (un JSON por corrida en src/data/evaluaciones).
        Números sin ajustar. El conjunto que importa es `holdout`.
        Pantalla de la demo: "Métricas de seguridad de la IA".
      responses:
        '200':
          description: Última corrida por conjunto y modo, e historial
          content:
            application/json:
              schema:
                type: object
                properties:
                  nota: { type: string }
                  ultimas:
                    type: array
                    items:
                      type: object
                      properties:
                        fecha: { type: string, format: date-time }
                        version: { type: string, description: 'versión del paquete + commit' }
                        conjunto: { type: string, enum: [original, holdout] }
                        modo: { type: string, enum: [simulado, llm] }
                        proveedor: { type: [string, 'null'] }
                        modelo: { type: [string, 'null'] }
                        casos: { type: integer }
                        recallGraves: { type: [number, 'null'], description: 'Fracción 0–1 de casos graves que alertaron' }
                        tasaFalsasAlarmas: { type: [number, 'null'], description: 'Fracción 0–1 de casos no graves que alertaron como graves' }
                        riesgoExacto: { type: [number, 'null'] }
                        precisionTema: { type: [number, 'null'] }
                        precisionPorTema:
                          type: object
                          additionalProperties:
                            type: object
                            properties: { ok: { type: integer }, total: { type: integer }, precision: { type: number } }
                        gravesPerdidos:
                          type: array
                          items: { type: object, properties: { texto: { type: string }, esperado: { type: string }, obtenido: { type: [string, 'null'] } } }
                        falsasAlarmas:
                          type: array
                          items: { type: object, properties: { texto: { type: string }, esperado: { type: [string, 'null'] }, obtenido: { type: string } } }
                  historial:
                    type: array
                    items: { type: object, description: Igual que `ultimas` sin las listas de casos }
              example:
                nota: Resultados reales, sin ajustar.
                ultimas:
                  - { fecha: '2026-10-20T06:39:00.000Z', version: 1.0.0+5c6e665, conjunto: holdout, modo: simulado, proveedor: null, modelo: null, casos: 57, recallGraves: 0.5, tasaFalsasAlarmas: 0.0541, riesgoExacto: 0.7368, precisionTema: 0.8182, precisionPorTema: {}, gravesPerdidos: [], falsasAlarmas: [] }
                historial: []
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /api/ia/consentimiento:
    get:
      tags: [Chat de la familia (existente, modulo-ia)]
      operationId: getConsentimiento
      summary: Estado del consentimiento informado del perfil activo
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  versionVigente: { type: string, example: '3' }
                  aceptado: { type: boolean }
                  aceptadoEn: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Chat de la familia (existente, modulo-ia)]
      operationId: aceptarConsentimiento
      summary: Aceptar el consentimiento (la versión que se mostró)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: string, example: '3' } } }
      responses:
        '200': { description: 'Ya estaba aceptado: `{ message, aceptadoEn }`' }
        '201': { description: 'Aceptado: `{ message, aceptadoEn }`' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: 'La versión enviada no es la vigente (el texto cambió): volver a mostrarlo' }
    delete:
      tags: [Chat de la familia (existente, modulo-ia)]
      operationId: revocarConsentimiento
      summary: Revocar el consentimiento (borra también las conversaciones del perfil)
      responses:
        '200':
          description: Revocado
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string }, conversacionesEliminadas: { type: integer } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /api/ia/conversaciones:
    get:
      tags: [Chat de la familia (existente, modulo-ia)]
      operationId: getMisConversaciones
      summary: Conversaciones del perfil activo
      responses:
        '200':
          description: Lista (sin mensajes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversaciones:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        titulo: { type: string }
                        edadHijo: { type: [integer, 'null'] }
                        ultimaActividad: { type: string, format: date-time }
                        createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: 'Rol distinto de padre o CONSENTIMIENTO_REQUERIDO' }
    post:
      tags: [Chat de la familia (existente, modulo-ia)]
      operationId: crearConversacion
      summary: Nueva conversación (sin cuerpo)
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { type: object, properties: { conversacion: { type: object, properties: { _id: { type: string }, titulo: { type: string, example: Nueva conversación }, mensajes: { type: array, items: { type: object } } } } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: 'Rol distinto de padre o CONSENTIMIENTO_REQUERIDO' }

  /api/ia/conversaciones/{id}:
    get:
      tags: [Chat de la familia (existente, modulo-ia)]
      operationId: getConversacion
      summary: Conversación completa con sus mensajes
      description: Cada mensaje trae los campos de `mensajeUsuario` / `respuesta` de POST .../mensajes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '`{ conversacion }` con `mensajes[]`' }
        '400': { description: ID inválido }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: 'Rol distinto de padre o CONSENTIMIENTO_REQUERIDO' }
        '404': { description: No existe o es de otra familia o perfil }
    delete:
      tags: [Chat de la familia (existente, modulo-ia)]
      operationId: eliminarConversacion
      summary: Borrar una conversación
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '`{ message: "Conversación eliminada" }`' }
        '400': { description: ID inválido }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { description: Conversación no encontrada }

  /api/ia/conversaciones/{id}/ayuda:
    post:
      tags: [Chat de la familia (existente, modulo-ia)]
      operationId: pedirAyuda
      summary: La familia acepta que el colegio la contacte (riesgo moderado)
      description: 'Solo cuando la última respuesta de Edumon trae `ofrecerAyuda` sin solicitar. Crea una alerta con `origen: solicitada`.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: '`{ mensaje }`: confirmación de Edumon (texto fijo)' }
        '400': { description: ID inválido }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { description: Conversación no encontrada }
        '409': { description: No hay una oferta de ayuda pendiente en esta conversación }

  /api/ia/alertas:
    get:
      tags: [Bitácora de alertas]
      operationId: getAlertas
      summary: (Existente) Alertas visibles para el usuario
      description: |
        Roles: **administrador** y **docente**. El admin y el responsable de convivencia ven todas
        las de la institución; otro docente, solo las de familias de sus cursos. Pantalla de la
        demo: tablero de convivencia. Cada alerta trae `rutaAtencion` e `historial[]` (EventoBitacora).
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [nueva, en_atencion, cerrada] } }
      responses:
        '200':
          description: Más recientes primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  alertas:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        categoria: { type: string }
                        origen: { type: string, enum: [automatica, solicitada] }
                        estado: { type: string, enum: [nueva, en_atencion, cerrada] }
                        mensajeDisparador: { type: string }
                        usuarioId: { type: object, description: 'Familia (nombre, apellido, telefono, correo)' }
                        perfilId: { type: [object, 'null'] }
                        atendidaPor: { type: [object, 'null'] }
                        deteccion: { $ref: '#/components/schemas/Deteccion' }
                        rutaAtencion: { $ref: '#/components/schemas/RutaAtencion' }
                        historial: { type: array, items: { $ref: '#/components/schemas/EventoBitacora' } }
                        createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: Rol no autorizado o usuario sin institución }

  /api/ia/conversaciones/{id}/mensajes:
    post:
      tags: [Proveedores de IA]
      operationId: enviarMensaje
      summary: (Existente) Enviar un mensaje a Edumon — campos nuevos en la respuesta
      description: |
        Rol autorizado: **padre** con consentimiento vigente. Contrato existente sin
        cambios de forma; se AGREGAN `respuesta.ia` y campos en `mensajeUsuario.deteccion`,
        y el error 429 `LIMITE_IA`. Pantalla de la demo: chat de la familia.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: ID de la conversación }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contenido]
              properties:
                contenido: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Mensaje procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensajeUsuario:
                    type: object
                    description: Mensaje del cuidador tal como se guardó
                    properties:
                      _id: { type: string }
                      contenido: { type: string }
                      nivelRiesgo: { type: string, enum: [normal, atencion, riesgo_moderado, riesgo] }
                      deteccion: { $ref: '#/components/schemas/Deteccion' }
                  respuesta:
                    type: object
                    description: Mensaje de Edumon (campos existentes + `ia`)
                    properties:
                      _id: { type: string }
                      contenido: { type: string }
                      tipo: { type: string, enum: [respuesta, pedir_edad, fuera_alcance, no_tareas, apoyo, riesgo, charla] }
                      fuentes:
                        type: array
                        items: { type: object, properties: { nombre: { type: string }, url: { type: [string, 'null'] } } }
                      ia: { $ref: '#/components/schemas/GeneracionIA' }
                  conversacion:
                    type: object
                    properties:
                      _id: { type: string }
                      titulo: { type: string }
                      edadHijo: { type: [integer, 'null'] }
        '400': { description: 'ID inválido o mensaje vacío / de más de 2000 caracteres' }
        '403': { description: 'Rol distinto de padre, o `code: CONSENTIMIENTO_REQUERIDO`' }
        '404': { description: Conversación no encontrada }
        '429': { $ref: '#/components/responses/LimiteIA' }

  /api/ia/conversaciones/{id}/mensajes/{mensajeId}/explicacion:
    get:
      tags: [Explicabilidad]
      operationId: getExplicacionMensaje
      summary: Explicación de un mensaje del chat
      description: |
        Rol autorizado: **padre** dueño de la conversación, con consentimiento vigente
        (docentes y administradores NO pueden leer conversaciones: 403).
        `mensajeId` puede ser el mensaje del cuidador o la respuesta de Edumon: se explica el par.
        Pantalla de la demo: chat, enlace "¿Por qué Edumon dijo esto?" bajo cada respuesta.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: ID de la conversación }
        - { name: mensajeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Explicación
          content:
            application/json:
              schema:
                type: object
                properties:
                  explicacion: { $ref: '#/components/schemas/ExplicacionMensaje' }
              example:
                explicacion:
                  mensajeId: 6716f1aa0000000000000001
                  respuestaId: 6716f1aa0000000000000002
                  nivelRiesgo: riesgo
                  riesgo: { categoria: autolesion_suicidio, etiqueta: riesgo de autolesión o suicidio, gravedad: grave }
                  decidio: regla
                  seNotificoAlColegio: true
                  rutaAtencion: null
                  clasificacion:
                    fuente: ia
                    proveedor: openai
                    modelo: gpt-4.1-mini
                    latenciaMs: 812
                    huboFallback: true
                    desdeCache: false
                    reglaSegura: { categoria: autolesion_suicidio, gravedad: grave, fragmento: se quiere morir }
                    reglaDudosa: null
                    modeloDijo: { nivelRiesgo: riesgo, gravedad: grave, categoria: autolesion_suicidio }
                    errorIA: null
                  respuesta: { tipo: riesgo, modo: plantilla, proveedor: null, modelo: null, latenciaMs: null, huboFallback: false, esTextoFijo: true }
                  fichas: []
                  fuentes: []
                  resumen: Posible riesgo grave … Una regla de seguridad reconoció "se quiere morir". Es un texto fijo revisado de antemano; ningún modelo lo redactó.
        '400': { description: ID de conversación o de mensaje inválido }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: 'Rol distinto de padre, o `code: CONSENTIMIENTO_REQUERIDO`' }
        '404': { description: Conversación no encontrada (o de otra familia) o mensaje que no es de esa conversación }

  /api/ia/alertas/{id}/explicacion:
    get:
      tags: [Explicabilidad]
      operationId: getExplicacionAlerta
      summary: Por qué se generó una alerta
      description: |
        Roles: **administrador** y **docente**, con la visibilidad de `GET /api/ia/alertas`.
        Pantalla de la demo: detalle de la alerta en el tablero de convivencia.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Explicación
          content:
            application/json:
              schema:
                type: object
                properties:
                  explicacion: { $ref: '#/components/schemas/ExplicacionAlerta' }
        '400': { description: ID inválido }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: Rol no autorizado o usuario sin institución }
        '404': { description: Alerta no encontrada o no visible }

  /api/ia/cursos/{cursoId}/ciclo:
    get:
      tags: [Ciclo Edumon]
      operationId: getCicloCurso
      summary: Temas anónimos del curso y retos creados sobre cada tema
      description: Pantalla de la demo — vista del docente "¿Qué preguntan las familias de mi curso?".
      parameters:
        - { name: cursoId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Vista del ciclo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CicloCurso' }
              example:
                curso: { _id: 6716f2000000000000000001, nombre: Grado Quinto }
                ventana: { desde: '2026-09-20T15:00:00.000Z', dias: 30 }
                minimoFamilias: 5
                hayTemasOcultos: true
                temas:
                  - { eje: estilos_vida_saludable, subtema: pantallas, familias: 6, subtemaLabel: Pantallas y celular, ejeLabel: Estilos de vida saludables, retosCreados: [] }
        '400': { description: ID de curso inválido }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: 'Rol no autorizado (padre, superadmin)' }
        '404': { description: Curso no encontrado o sin permisos sobre él }

  /api/ia/cursos/{cursoId}/ciclo/sugerencia:
    post:
      tags: [Ciclo Edumon]
      operationId: sugerirDesdeCiclo
      summary: Sugerencia de módulos y borrador de reto a partir del tema principal del curso
      description: |
        Reutiliza el sugeridor de módulos y el generador de retos existentes (con IA si hay llave;
        catálogo/plantilla en modo simulado). El borrador NO se guarda: el docente lo publica con el
        flujo normal de retos (POST de tareas), con `escuelaPadres: { eje, subtema }`.
        Pantalla de la demo — botón "Sugerirme un reto" en la vista del ciclo. Comparte el 429 LIMITE_IA.
      parameters:
        - { name: cursoId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sugerencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  basadoEn:
                    type: object
                    properties:
                      eje: { type: string }
                      subtema: { type: string }
                      subtemaLabel: { type: string }
                      familias: { type: integer }
                  modulos:
                    type: object
                    description: Igual que POST /api/ia/modulos/sugerencias
                    properties:
                      modulos: { type: array, items: { type: object, properties: { titulo: { type: string }, descripcion: { type: string }, eje: { type: string }, ejeLabel: { type: string }, ideasRetos: { type: array, items: { type: string } } } } }
                      generadoPor: { type: string, enum: [ia, catalogo] }
                  reto:
                    type: object
                    description: 'Igual que `borrador` de POST /api/ia/retos/borrador (eje, subtema, tema, titulo, descripcionHtml, criteriosHtml, recursos, fuentes, duracionDias, generadoPor…)'
        '400': { description: ID de curso inválido }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: Rol no autorizado }
        '404': { description: Curso no encontrado o sin permisos sobre él }
        '422':
          description: Ningún tema reúne 5 familias todavía
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, const: SIN_TEMAS_SUFICIENTES }
        '429': { $ref: '#/components/responses/LimiteIA' }

  /api/ia/alertas/{id}/integridad:
    get:
      tags: [Bitácora de alertas]
      operationId: verificarIntegridadAlerta
      summary: Verifica la cadena de hashes de una alerta
      description: |
        Pantalla de la demo: detalle de la alerta, botón **"Verificar integridad"**.
        Recalcula todos los hashes; si alguien editó la base de datos, dice en qué evento se rompe.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Resultado de la verificación (200 también cuando la cadena está rota)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegridadAlerta' }
              examples:
                valida:
                  value: { alertaId: 6716f0c2a1b2c3d4e5f60718, valida: true, eventos: 3, ultimoHash: 9f2c…e1, rotaEn: null, estadoCoherente: true, verificadaEn: '2026-10-20T15:10:00.000Z' }
                rota:
                  value: { alertaId: 6716f0c2a1b2c3d4e5f60718, valida: false, eventos: 3, ultimoHash: 9f2c…e1, rotaEn: { indice: 1, accion: estado, en: '2026-10-20T14:01:00.000Z', motivo: hash_no_coincide }, estadoCoherente: true, verificadaEn: '2026-10-20T15:10:00.000Z' }
        '400': { description: ID inválido }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: 'Rol no autorizado (padre, superadmin) o usuario sin institución' }
        '404': { description: Alerta no encontrada o no visible para el usuario }

  /api/ia/alertas/integridad:
    get:
      tags: [Bitácora de alertas]
      operationId: verificarIntegridadAlertas
      summary: Verifica todas las alertas visibles para el usuario
      description: Pantalla de la demo — tablero de convivencia, indicador general "Bitácora íntegra".
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema:
                type: object
                required: [valida, alertas, eventos, rotas, verificadaEn]
                properties:
                  valida: { type: boolean, description: true si TODAS las cadenas cuadran }
                  alertas: { type: integer }
                  eventos: { type: integer }
                  rotas: { type: array, items: { $ref: '#/components/schemas/IntegridadAlerta' } }
                  verificadaEn: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { description: 'Rol no autorizado o usuario sin institución' }

  /api/ia/alertas/{id}:
    patch:
      tags: [Bitácora de alertas]
      operationId: actualizarAlerta
      summary: (Existente) Cambiar estado o nota — nuevo error 409
      description: |
        Contrato existente. Cambios: los eventos del `historial` traen `seq`, `hashAnterior`
        y `hash`; si otro usuario modificó la alerta al mismo tiempo responde **409**
        (la web debe recargar la alerta y reintentar).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { type: string, enum: [nueva, en_atencion, cerrada] }
                notas: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Alerta actualizada, con historial encadenado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  alerta:
                    type: object
                    description: Alerta completa (contrato existente); `historial` usa EventoBitacora
                    properties:
                      historial: { type: array, items: { $ref: '#/components/schemas/EventoBitacora' } }
        '400': { description: Estado o notas inválidos }
        '404': { description: Alerta no encontrada }
        '409':
          description: La alerta cambió mientras se editaba
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, const: ALERTA_MODIFICADA }

  # Los demás endpoints que llaman a la IA comparten el mismo 429 LIMITE_IA:
  # POST /api/ia/retos/borrador, POST /api/ia/modulos/sugerencias,
  # POST /api/ia/lineamientos/borrador (contratos existentes sin otros cambios).

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: access_token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    NoAutenticado:
      description: Sin sesión
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Token requerido }
    SinPermiso:
      description: Rol no autorizado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: No tienes permisos para esta acción }
    LimiteIA:
      description: |
        Límite por usuario (IA_RATE_LIMIT_MAX solicitudes cada IA_RATE_LIMIT_WINDOW_SECONDS).
        Trae la cabecera `Retry-After` (segundos). La web debe mostrar `message` tal cual.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema:
            type: object
            required: [message, code, retryAfter]
            properties:
              message: { type: string }
              code: { type: string, const: LIMITE_IA }
              retryAfter: { type: integer, description: Segundos de espera }
          example:
            message: Llegaste al límite de 20 solicitudes a Edumon cada 60 segundos. Espera 37 s y vuelve a intentarlo.
            code: LIMITE_IA
            retryAfter: 37

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }

    SaludIA:
      type: object
      required: [modo, orden, timeoutMs, cooldownSegundos, proveedores]
      properties:
        modo: { type: string, enum: [llm, simulado], description: '`simulado` = no hay ninguna llave' }
        orden: { type: array, items: { type: string, enum: [groq, openai] }, description: Valor efectivo de LLM_PROVIDER_ORDER }
        timeoutMs: { type: integer }
        cooldownSegundos: { type: number }
        proveedores:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string, enum: [groq, openai] }
              modelo: { type: string }
              orden: { type: [integer, 'null'], description: Posición en el orden; null si no está en LLM_PROVIDER_ORDER }
              estado: { type: string, enum: [activo, en_cooldown, sin_llave, fuera_del_orden] }
              cooldownRestanteSegundos: { type: integer }
              motivoCooldown: { type: [string, 'null'], enum: [rate_limit, auth, null] }
              ultimaLatenciaMs: { type: [integer, 'null'] }
              ultimoExito: { type: [string, 'null'], format: date-time }
              ultimoError:
                type: [object, 'null']
                properties:
                  tipo: { type: string, enum: [rate_limit, auth, servidor, timeout, red, peticion, respuesta] }
                  status: { type: [integer, 'null'] }
                  en: { type: string, format: date-time }

    GeneracionIA:
      type: [object, 'null']
      description: Quién redactó la respuesta de Edumon. null en mensajes anteriores a esta rama.
      properties:
        modo:
          type: string
          enum: [llm, fichas_fallback, simulado, plantilla]
          description: |
            llm = la redactó un proveedor; fichas_fallback = todos los proveedores fallaron y se
            respondió con la ficha curada; simulado = no hay llaves; plantilla = texto fijo
            (riesgo grave, charla, límites, apoyo).
        proveedor: { type: [string, 'null'], enum: [groq, openai, null] }
        modelo: { type: [string, 'null'] }
        latenciaMs: { type: [integer, 'null'] }
        huboFallback: { type: boolean }
        proveedoresFallidos: { type: array, items: { type: string } }

    CicloCurso:
      type: object
      properties:
        curso: { type: object, properties: { _id: { type: string }, nombre: { type: string } } }
        ventana: { type: object, properties: { desde: { type: string, format: date-time }, dias: { type: integer } } }
        minimoFamilias: { type: integer, const: 5 }
        hayTemasOcultos: { type: boolean, description: 'Hay temas con menos de 5 familias (no se muestran ni se cuentan)' }
        temas:
          type: array
          description: Ordenados de más a menos familias
          items:
            type: object
            properties:
              eje: { type: string }
              ejeLabel: { type: string }
              subtema: { type: string }
              subtemaLabel: { type: string }
              familias: { type: integer, minimum: 5 }
              retosCreados:
                type: array
                items:
                  type: object
                  properties:
                    tareaId: { type: string }
                    titulo: { type: string }
                    estado: { type: string, enum: [publicada, cerrada] }
                    fechaEntrega: { type: string, format: date-time }

    Hallazgo:
      type: [object, 'null']
      properties:
        categoria: { type: string }
        gravedad: { type: string, enum: [moderado, grave] }
        fragmento: { type: [string, 'null'], description: Fragmento del mensaje que activó la regla }
        aproximado: { type: boolean, description: 'La regla coincidió después de corregir la ortografía (solo reglas graves)' }
        correcciones:
          type: array
          items: { type: object, properties: { de: { type: string }, a: { type: string } } }
          example: [{ de: kiero, a: quiero }]

    RutaAtencion:
      type: [object, 'null']
      description: |
        Punto 3 — clasificación de ruta. Viene en cada alerta (`GET /api/ia/alertas`,
        `GET /api/ia/alertas/{id}`, explicación) y en el mensaje del cuidador con riesgo.
        null en mensajes sin riesgo y en alertas anteriores a esta rama.
        - ambito `escolar` → `tipoLey1620` I/II/III (Decreto 1965 de 2013, art. 40) y protocolo del tipo (arts. 42-44).
        - ambito `hogar` → `tipoLey1620` null; protocolo según Ley 1098 de 2006, art. 44 (num. 9 reportar / num. 2 apoyo).
        - ambito `personal` (riesgo suicida) → `tipoLey1620` null; protocolo de salud mental con `fuentePendiente`.
        La web debe mostrar siempre `nota` ("Pendiente de validación por orientación/convivencia").
      properties:
        ambito: { type: string, enum: [escolar, hogar, personal] }
        tipoLey1620: { type: [string, 'null'], enum: [I, II, III, null] }
        protocolo: { type: [string, 'null'] }
        criterio: { type: string, description: Por qué se asignó esta ruta }
        fundamento:
          type: array
          items:
            type: object
            properties:
              norma: { type: string }
              articulo: { type: string }
              fuente: { type: string, description: URL oficial (Gestor Normativo de Función Pública) }
              texto: { type: string, description: Texto literal del artículo o numeral }
        fuentePendiente: { type: [string, 'null'], description: Texto oficial que falta obtener (no se reconstruyó de memoria) }
        pendienteValidacion: { type: boolean, const: true }
        nota: { type: string }

    ExplicacionMensaje:
      type: object
      properties:
        mensajeId: { type: [string, 'null'], description: Mensaje del cuidador }
        respuestaId: { type: [string, 'null'], description: Respuesta de Edumon }
        nivelRiesgo: { type: [string, 'null'], enum: [normal, atencion, riesgo_moderado, riesgo, null] }
        riesgo:
          type: [object, 'null']
          properties:
            categoria: { type: [string, 'null'] }
            etiqueta: { type: [string, 'null'] }
            gravedad: { type: string, enum: [moderado, grave] }
        decidio:
          type: [string, 'null']
          enum: [regla, modelo, ambos, null]
          description: Quién determinó el riesgo (o, sin riesgo, quién clasificó el mensaje)
        seNotificoAlColegio: { type: boolean }
        rutaAtencion: { $ref: '#/components/schemas/RutaAtencion' }
        clasificacion:
          type: [object, 'null']
          properties:
            fuente: { type: string, enum: [ia, reglas] }
            proveedor: { type: [string, 'null'] }
            modelo: { type: [string, 'null'] }
            latenciaMs: { type: [integer, 'null'] }
            huboFallback: { type: boolean }
            desdeCache: { type: boolean }
            reglaSegura: { $ref: '#/components/schemas/Hallazgo' }
            reglaDudosa: { $ref: '#/components/schemas/Hallazgo' }
            modeloDijo:
              type: [object, 'null']
              properties:
                nivelRiesgo: { type: string }
                gravedad: { type: string }
                categoria: { type: string }
            errorIA: { type: [string, 'null'] }
        respuesta:
          type: [object, 'null']
          properties:
            tipo: { type: [string, 'null'] }
            modo: { type: [string, 'null'], enum: [llm, fichas_fallback, simulado, plantilla, null] }
            proveedor: { type: [string, 'null'] }
            modelo: { type: [string, 'null'] }
            latenciaMs: { type: [integer, 'null'] }
            huboFallback: { type: boolean }
            esTextoFijo: { type: boolean }
        fichas:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              titulo: { type: string }
              eje: { type: string }
              subtema: { type: string }
              edades: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
              fuente: { type: [object, 'null'], properties: { nombre: { type: string }, url: { type: [string, 'null'] } } }
        fuentes:
          type: array
          items: { type: object, properties: { nombre: { type: string }, url: { type: [string, 'null'] } } }
        resumen: { type: string, description: Texto listo para mostrar }

    ExplicacionAlerta:
      type: object
      properties:
        alertaId: { type: string }
        origen: { type: string, enum: [automatica, solicitada] }
        categoria: { type: string }
        etiqueta: { type: [string, 'null'] }
        decidio: { type: [string, 'null'], enum: [regla, modelo, ambos, familia, null] }
        mensajeDisparador: { type: string }
        rutaAtencion: { $ref: '#/components/schemas/RutaAtencion' }
        clasificacion: { type: [object, 'null'], description: Igual que en ExplicacionMensaje (sin latencia ni caché) }
        resumen: { type: string }

    EventoBitacora:
      type: object
      description: Evento del historial de una alerta (campos nuevos seq, hashAnterior, hash)
      properties:
        accion: { type: string, enum: [creada, estado, nota] }
        estado: { type: [string, 'null'], enum: [nueva, en_atencion, cerrada, null] }
        nota: { type: string }
        por: { description: 'Usuario (populado con nombre, apellido y rol) o null si fue Edumon' }
        en: { type: string, format: date-time }
        seq: { type: integer, description: Posición en la cadena (0 = creación) }
        hashAnterior: { type: string, description: 'Hash del evento anterior (o génesis de la alerta)' }
        hash: { type: string, description: SHA-256 hex del evento }

    IntegridadAlerta:
      type: object
      required: [alertaId, valida, eventos, rotaEn, estadoCoherente]
      properties:
        alertaId: { type: string }
        valida: { type: boolean }
        eventos: { type: integer }
        ultimoHash: { type: [string, 'null'] }
        estadoCoherente: { type: boolean, description: 'El estado visible coincide con el último cambio registrado' }
        rotaEn:
          type: [object, 'null']
          description: Primer evento donde la cadena deja de cuadrar
          properties:
            indice: { type: integer }
            accion: { type: string }
            en: { type: [string, 'null'], format: date-time }
            motivo:
              type: string
              enum: [sin_hash, secuencia, enlace_roto, hash_no_coincide]
              description: |
                sin_hash = evento anterior a la bitácora (correr npm run bitacora:encadenar);
                secuencia = falta o sobra un evento; enlace_roto = no apunta al anterior
                (o se cambió el mensaje/categoría de la alerta); hash_no_coincide = se editó el evento.
        verificadaEn: { type: string, format: date-time }

    Deteccion:
      type: [object, 'null']
      description: Por qué se clasificó así el mensaje (campos nuevos marcados).
      properties:
        fuente: { type: string, enum: [ia, reglas] }
        modelo: { type: [string, 'null'] }
        decidio: { type: [string, 'null'], enum: [regla, regla_confirmada_por_ia, ia, null] }
        errorIA: { type: [string, 'null'], description: Motivo legible si el LLM falló y respondieron las reglas }
        proveedor: { type: [string, 'null'], description: NUEVO }
        latenciaMs: { type: [integer, 'null'], description: NUEVO }
        huboFallback: { type: boolean, description: 'NUEVO: true si falló al menos un proveedor (incluido caer a reglas)' }
        proveedoresFallidos: { type: array, items: { type: string }, description: NUEVO }
        desdeCache: { type: boolean, description: 'NUEVO: la clasificación salió de la caché' }
